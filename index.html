        "⚖️ 법률 및 형사책임 방어존",
        "💰 가격비교 & 다이렉트 초특가",
        "🏥 부상 및 상해 집중 보장",
        "👨‍👩‍👧 가족 및 연령별 맞춤 플랜",
        "🛠️ 특약 설계 및 보험 리모델링",
        "📘 초보자를 위한 보험 지식인"
    ];

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    const contentArea = document.getElementById('content-area');
    const shuffledCategories = shuffle([...categories]);
    const shuffledData = shuffle([...data]);

    // 약 75개 정도를 무작위로 추출하여 사용
    const selectedData = shuffledData.slice(0, 75);

    shuffledCategories.forEach((cat, index) => {
        const section = document.createElement('section');
        section.className = 'category-section';
        
        const title = document.createElement('h2');
        title.className = 'category-title';
        title.innerText = cat;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid-container';

        // 카테고리당 대략 10~11개씩 배분
        const itemsPerCat = selectedData.splice(0, Math.ceil(selectedData.length / (shuffledCategories.length - index)));
        
        itemsPerCat.forEach(item => {
            const card = document.createElement('div');
            card.className = 'info-card';
            card.innerHTML = `
                <a href="${item.url}" target="_blank">
                    <span class="card-tag">TOP 추천</span>
                    <div class="card-title">${item.name}</div>
                    <div class="card-desc">${item.desc}</div>
                </a>
            `;
            grid.appendChild(card);
        });

        section.appendChild(grid);
        contentArea.appendChild(section);
    });
